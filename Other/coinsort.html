<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            pointer-events: none;
        }

        #ui h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #00ffcc;
        }

        #ui h2 {
            margin: 5px 0;
            font-size: 24px;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            text-align: center;
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border: 6px solid #ff0055;
            border-radius: 15px;
            box-shadow: 0 0 30px #ff0055;
        }

        #game-over h1 {
            margin-top: 0;
            font-size: 48px;
        }

        button {
            pointer-events: auto;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #000;
            border: 4px solid #000;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        button:hover {
            background: #ff0055;
            color: #fff;
            transform: scale(1.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="ui">
        <h1>SORTER 3000 🤑</h1>
        <h2>SCORE: <span id="score">0</span></h2>
        <h2>TIME: <span id="time">60</span>s</h2>
    </div>
    <div id="game-over">
        <h1>TIME'S UP 🤡</h1>
        <h2>FINAL SCORE: <span id="final-score"></span></h2>
        <br>
        <button onclick="location.reload()">RESTART BRO 😭</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const bins = [];
        const binConfig = [
            { color: 0xcd7f32, x: -6, val: 1, name: "BRONZE" },
            { color: 0xc0c0c0, x: 0, val: 5, name: "SILVER" },
            { color: 0xffd700, x: 6, val: 10, name: "GOLD" }
        ];

        binConfig.forEach(cfg => {
            const geo = new THREE.BoxGeometry(4, 2.5, 4);
            const mat = new THREE.MeshPhysicalMaterial({
                color: cfg.color,
                transmission: 0.5,
                opacity: 0.8,
                transparent: true,
                roughness: 0.1,
                metalness: 0.9
            });
            const bin = new THREE.Mesh(geo, mat);
            bin.position.set(cfg.x, 1.25, -5);
            bin.userData = { value: cfg.val };
            bin.receiveShadow = true;
            scene.add(bin);
            bins.push(bin);
        });

        const coins = [];
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshBasicMaterial({ visible: false });
        const dragPlane = new THREE.Mesh(planeGeo, planeMat);
        dragPlane.rotation.x = -Math.PI / 2;
        scene.add(dragPlane);

        let score = 0;
        let timeLeft = 60;
        let draggedCoin = null;
        let isGameOver = false;

        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function spawnCoin() {
            if (isGameOver) return;
            const cfg = binConfig[Math.floor(Math.random() * binConfig.length)];
            const radius = cfg.val === 1 ? 0.9 : cfg.val === 5 ? 1.2 : 1.5;
            const geo = new THREE.CylinderGeometry(radius, radius, 0.3, 32);

            const isChaos = Math.random() > 0.85;
            const mat = new THREE.MeshStandardMaterial({
                color: isChaos ? 0xff00ff : cfg.color,
                metalness: 1,
                roughness: 0.2,
                emissive: isChaos ? 0xff0055 : 0x000000,
                emissiveIntensity: isChaos ? 0.5 : 0
            });

            const coin = new THREE.Mesh(geo, mat);
            coin.position.set((Math.random() - 0.5) * 16, 0.5, 6 + Math.random() * 4);
            coin.castShadow = true;
            coin.userData = { value: cfg.val, isChaos: isChaos };
            scene.add(coin);
            coins.push(coin);
        }

        setInterval(spawnCoin, 1200);

        const timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                isGameOver = true;
                clearInterval(timerInterval);
                gameOverEl.style.display = 'block';
                finalScoreEl.innerText = score;
                playSfx(150, 'sawtooth', 1.5);
            } else {
                timeLeft--;
                timeEl.innerText = timeLeft;
                if (timeLeft <= 10) timeEl.style.color = '#ff0055';
            }
        }, 1000);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            if (isGameOver) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(coins);
            if (intersects.length > 0) {
                draggedCoin = intersects[0].object;
                playSfx(600, 'sine', 0.1);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!draggedCoin || isGameOver) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(dragPlane);
            if (intersects.length > 0) {
                draggedCoin.position.x = intersects[0].point.x;
                draggedCoin.position.z = intersects[0].point.z;
                draggedCoin.position.y = 3;
            }
        });

        window.addEventListener('mouseup', () => {
            if (!draggedCoin || isGameOver) return;
            let sorted = false;

            bins.forEach(bin => {
                if (draggedCoin.position.distanceTo(bin.position) < 4) {
                    if (draggedCoin.userData.value === bin.userData.value) {
                        const multiplier = draggedCoin.userData.isChaos ? 3 : 1;
                        score += (draggedCoin.userData.value * multiplier);
                        playSfx(1200, 'square', 0.2);
                    } else {
                        score -= 10;
                        playSfx(200, 'sawtooth', 0.4);
                    }
                    scoreEl.innerText = score;
                    scene.remove(draggedCoin);
                    coins.splice(coins.indexOf(draggedCoin), 1);
                    sorted = true;
                }
            });

            if (!sorted) draggedCoin.position.y = 0.5;
            draggedCoin = null;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            coins.forEach(c => {
                if (c.userData.isChaos) {
                    c.rotation.x += 0.2;
                    c.rotation.y += 0.2;
                    c.position.x += Math.sin(Date.now() * 0.01) * 0.1;
                } else {
                    c.rotation.y += 0.03;
                }
            });
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
